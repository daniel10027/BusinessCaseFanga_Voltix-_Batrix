name: CI

on:
  push:
    branches: [dev, preprod, production]
  pull_request:
    branches: [dev, preprod, production]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: lint-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fanga
          POSTGRES_PASSWORD: fanga
          POSTGRES_DB: fanga_ingest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fanga"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fanga:fanga@localhost:5432/fanga_ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # Mosquitto a besoin de la configuration de démo (allow_anonymous) :
      # un conteneur « services » démarre avant le checkout et ne peut donc
      # pas monter un fichier du dépôt, d'où un lancement manuel ici.
      - name: Démarrer Mosquitto (configuration de démo)
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            -v ${{ github.workspace }}/deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro \
            eclipse-mosquitto:2

      - name: Appliquer les migrations
        run: alembic -c src/fanga_ingest/adapters/persistence/alembic.ini upgrade head

      - name: Tests unitaires et d'intégration
        run: pytest tests/unit tests/integration --cov=src/fanga_ingest --cov-report=

      - name: Couverture — domain + application (seuil 90 %)
        run: coverage report --include="src/fanga_ingest/domain/*,src/fanga_ingest/application/*" --fail-under=90

      - name: Couverture — globale (seuil 80 %)
        run: coverage report --fail-under=80

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image (sans la publier)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
