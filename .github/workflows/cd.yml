name: CD

on:
  push:
    branches: [preprod, production]

jobs:
  # Le test de bout en bout construit l'image, démarre toute la pile
  # (`docker compose up --build`), rejoue le document, vérifie l'état final
  # et démonte proprement — tout est déjà dans tests/e2e/test_demo_scenario.py
  # (fixture `running_stack`), pas besoin de le redupliquer ici en YAML.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests de bout en bout (construit, démarre, rejoue, démonte la pile)
        run: pytest tests/e2e -v

  publish:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nécessaire pour que `git describe --tags` trouve le tag de version

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déterminer le(s) tag(s) de l'image
        id: image_tags
        run: |
          # Une référence d'image Docker doit être en minuscules, sans
          # séquences comme "-_" : le nom du dépôt GitHub ne respecte ni
          # l'un ni l'autre ("BusinessCase...Voltix-_Batrix"). On construit
          # donc l'image à partir du seul propriétaire (déjà propre) et d'un
          # nom d'application fixe, plutôt que du nom complet du dépôt.
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/fanga-ingest"
          if [ "${{ github.ref_name }}" = "production" ]; then
            VERSION=$(git describe --tags --always)
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:preprod-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    # Environnement GitHub "preprod" ou "production" : à configurer par Daniel
    # (protection de branche + approbation manuelle requise en production).
    environment: ${{ github.ref_name }}
    steps:
      - name: "[SIMULATION] Déploiement sur le VPS — projet non hébergé"
        run: |
          echo "Ce projet n'est pas hébergé : les commandes suivantes ne sont PAS exécutées."
          echo "Elles montrent ce qui serait lancé sur le VPS de ${{ github.ref_name }} :"
          echo
          echo "  ssh deploy@vps 'cd /opt/fanga-ingest && \\"
          echo "    docker compose pull && \\"
          echo "    docker compose run --rm migrate && \\"
          echo "    docker compose up -d'"
