[project]
name = "fanga-ingest"
version = "0.1.0"
description = "Service d'ingestion multi-fournisseurs pour la plateforme FANGA OS (cabinets Voltix, batteries Batrix)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.13,<1.14",
    "aiomqtt>=2.3,<2.4",
    "pydantic>=2.9,<2.10",
    "pydantic-settings>=2.5,<2.6",
    "httpx>=0.27,<0.28",
    "prometheus-client>=0.21,<0.22",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<1.14",
    "import-linter>=2.1,<2.2",
    "pytest>=8.3,<8.4",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# --- Qualité -----------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# B008 : `Depends(...)` en valeur par défaut est l'idiome voulu par FastAPI,
# pas un appel de fonction accidentel.
"src/fanga_ingest/adapters/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["fanga_ingest.domain.*", "fanga_ingest.application.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["fanga_ingest"]
branch = true

[tool.coverage.report]
skip_empty = true
# Les seuils (90% domain+application, 80% global) sont vérifiés en CI via
# deux appels distincts à `coverage report --fail-under`, pas ici.

# --- Règle de dépendance (Clean Architecture) ---------------------------

[tool.importlinter]
root_package = "fanga_ingest"

[[tool.importlinter.contracts]]
name = "Le domaine ne dépend de rien d'autre dans le projet"
type = "forbidden"
source_modules = ["fanga_ingest.domain"]
forbidden_modules = [
    "fanga_ingest.application",
    "fanga_ingest.adapters",
    "fanga_ingest.main",
    "fanga_ingest.config",
]

[[tool.importlinter.contracts]]
name = "L'application ne dépend pas des adaptateurs"
type = "forbidden"
source_modules = ["fanga_ingest.application"]
forbidden_modules = [
    "fanga_ingest.adapters",
    "fanga_ingest.main",
    "fanga_ingest.config",
]

[[tool.importlinter.contracts]]
name = "Couches de haut niveau : main -> adapters -> application -> domain"
type = "layers"
layers = [
    "fanga_ingest.main",
    "fanga_ingest.adapters",
    "fanga_ingest.application",
    "fanga_ingest.domain",
]
